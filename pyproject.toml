[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict-ai"
version = "0.1.0"
description = "The verification layer for AI agents. Intercept, verify, and trust-score agent actions before they reach production."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Zaphenath Labs", email = "verdict@zaphenath.app" },
]
keywords = [
    "ai", "agents", "verification", "testing", "llm",
    "safety", "observability", "trust", "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.50"]
langchain = ["langchain-core>=0.3"]
all = ["anthropic>=0.39", "openai>=1.50", "langchain-core>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
verdict = "verdict.cli.main:cli"

[project.urls]
Homepage = "https://verdict.zaphenath.app"
Documentation = "https://verdict.zaphenath.app/docs"
Repository = "https://github.com/zaphenath/verdict"
Issues = "https://github.com/zaphenath/verdict/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
